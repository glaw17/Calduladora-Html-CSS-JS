<!DOCTYPE html>
<head>
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Calculadora</h1>
        <p>Primeira Calculadora usando HTML, CSS e JavaScript</p>
    </header>

    <div class="calculadora">
        <fieldset>
        <form>
            <label>Digite o Primeiro Número:</label><br>
            <input type="number" name="numero1" placeholder="45" required><br>

            <label>Digite o Segundo Número:</label><br>
            <input type="number" name="numero2" placeholder="22" required><br>

            <label>Selecione a operação:</label><br>
            <select name="operação" required>
                <option value="+">Soma +</option>
                <option value="-">Subtração -</option>
                <option value="/">Divisão /</option>
                <option value="*">Multilpicação *</option>
            </select> 
            <br><br>
            <div id="submit">
                <input type="submit" class="submit">
            </div>
        </form>
        </fieldset>
    </div>
</body>
</html>
