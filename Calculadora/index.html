<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculadora</title>
</head>
<body>
    <header>
        <h1>Calculadora</h1>
        <p>Primeira Calculadora usando HTML, CSS e JavaScript</p>
    </header>

    <div class="calculadora">
        <fieldset>
        <form id="form">
            <label>Digite o Primeiro Número:</label><br>
            <input type="number" name="numero1" step="any" placeholder="45" required><br>

            <label>Digite o Segundo Número:</label><br>
            <input type="number" name="numero2" step="any" placeholder="22" required><br>

            <label>Selecione a operação:</label><br>
            <select name="operacao" required>
                <option value="+">Soma +</option>
                <option value="-">Subtração -</option>
                <option value="/">Divisão /</option>
                <option value="*">Multilpicação *</option>
                <option value="^">Potenciação ^</option>
            </select> 
            <br><br>
            <div id="envio">
                <input type="submit" class="submit">
            </div>
        </form>
            <br>
            <p id="resultado"></p>
        </fieldset>
    </div>

    <script src="main.js"></script>
</body>
</html>
